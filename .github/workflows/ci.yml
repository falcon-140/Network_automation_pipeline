name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-tests:
    name: Python — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check config_manager tests

      - name: Run tests
        run: pytest tests/ -v --tb=short

  go-tests:
    name: Go — vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go/healthcheck
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -race -cover

  config-validation:
    name: Validate rendered configs for every device
    runs-on: ubuntu-latest
    needs: [python-tests]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Render + validate every device in inventory (fail build on drift-unsafe config)
        run: |
          python3 -c "
          import sys
          from config_manager import Inventory, ConfigRenderer, validate_config

          inventory = Inventory.from_yaml('inventory/devices.yaml')
          renderer = ConfigRenderer()
          failed = False
          for device in inventory.all():
              config = renderer.render(device)
              result = validate_config(device.hostname, config)
              status = 'OK' if result.is_valid else 'FAIL'
              print(f'{status}  {device.hostname} ({device.platform})')
              for issue in result.issues:
                  print(f'    [{issue.severity}] {issue.message}')
              if not result.is_valid:
                  failed = True
          sys.exit(1 if failed else 0)
          "
